<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GroundTruth Cibao · Plan B</title>
  <meta name="description" content="Crop-rotation decision support for rice farmers of the Dominican Republic, powered by NASA POWER data.">
  <meta name="theme-color" content="#0b3a82">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="home">
  <div class="bg" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="#home" data-go="home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 3c5 6 8 10.5 8 15a8 8 0 0 1-16 0c0-4.5 3-9 8-15z" fill="#1463c4"/>
        <path d="M16 29V15m0 6c-3-.5-5-2.5-5.5-5.5M16 18c3-.5 5-2.5 5.5-5.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>GroundTruth Cibao</span>
    </a>
    <nav class="nav" id="nav" aria-label="Secciones / Sections"></nav>
    <div class="top-right">
      <button type="button" class="btn small" id="install" hidden data-t="install"></button>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" class="on">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <!-- ===================== HOME ===================== -->
  <section class="hero" data-view="home">
    <!-- Animated landscape: sun, clouds, mountains, river and rice fields. Drawn by hand, no photos. -->
    <svg class="scene" viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8fc8ff"/><stop offset="0.55" stop-color="#d9efff"/><stop offset="1" stop-color="#fff1cf"/>
        </linearGradient>
        <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9bd67f"/><stop offset="1" stop-color="#3f9d5a"/>
        </linearGradient>
        <radialGradient id="sun"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.6" stop-color="#ffd35c"/><stop offset="1" stop-color="#ffd35c" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="1200" height="460" fill="url(#sky)"/>
      <circle class="sun" cx="1010" cy="110" r="120" fill="url(#sun)"/>
      <g class="cloud slow" fill="#fff" opacity="0.85"><ellipse cx="220" cy="90" rx="70" ry="22"/><ellipse cx="270" cy="76" rx="48" ry="20"/><ellipse cx="180" cy="80" rx="36" ry="15"/></g>
      <g class="cloud" fill="#fff" opacity="0.7"><ellipse cx="700" cy="60" rx="56" ry="17"/><ellipse cx="742" cy="50" rx="36" ry="15"/></g>
      <path d="M0 290L120 200l90 50 110-110 120 100 100-70 130 90 120-120 150 110 110-70 150 110v130H0z" fill="#7fa6c9" opacity="0.75"/>
      <path d="M0 330l160-80 120 50 140-90 150 80 130-50 160 70 150-70 190 90v100H0z" fill="#4c8f78"/>
      <path d="M0 350c200-30 420-20 640-8s400 14 560-6v124H0z" fill="url(#field)"/>
      <path d="M620 318c-40 26-130 30-170 60s-10 60 60 82" fill="none" stroke="#5fb0f5" stroke-width="26" stroke-linecap="round" opacity="0.9"/>
      <path class="river-flow" d="M620 318c-40 26-130 30-170 60s-10 60 60 82" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 26" opacity="0.8"/>
      <g stroke="#2f7f48" stroke-width="2" opacity="0.5" fill="none">
        <path d="M0 392c300-22 520-14 700-4M0 426c330-20 600-14 820-2M760 380c160 6 300 2 440-12M880 420c120 4 220 2 320-8"/>
      </g>
      <g class="sprouts" stroke="#1f6b3a" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M90 440v-22m0 8c-8-2-12-8-13-15m13 11c8-2 12-8 13-15"/><path d="M210 448v-24m0 9c-8-2-12-8-13-15m13 11c8-2 12-8 13-15"/>
        <path d="M930 440v-22m0 8c-8-2-12-8-13-15m13 11c8-2 12-8 13-15"/><path d="M1080 446v-24m0 9c-8-2-12-8-13-15m13 11c8-2 12-8 13-15"/>
      </g>
    </svg>

    <div class="hero-grid">
      <div class="glass hero-copy">
        <p class="eyebrow" data-t="eyebrow"></p>
        <h1 data-t="hero_title"></h1>
        <span class="flag-rule" aria-hidden="true"><i></i><i></i><i></i></span>
        <p class="lead" data-t="hero_lead"></p>
        <div class="hero-actions">
          <button type="button" class="btn primary big" id="don-pedro" data-t="pedro_btn"></button>
          <button type="button" class="btn big" id="start" data-t="start_btn"></button>
        </div>
        <p class="hero-note" data-t="pedro_note"></p>
      </div>
      <ol class="how" id="how"></ol>
    </div>

    <ul class="facts" id="facts"></ul>
  </section>

  <!-- ============ MY PLAN · ROTATION · OPTIONS · DATA (share the three steps) ============ -->
  <main class="layout" data-view="plan rotation options data">
    <aside class="glass controls" id="steps" aria-labelledby="farm-title">
      <h2 id="farm-title" data-t="farm"></h2>

      <div class="step">
        <span class="num">1</span>
        <div class="step-body">
          <h3 data-t="step1"></h3>
          <label class="field"><span data-t="zone"></span>
            <select id="zone"></select>
          </label>
          <div class="row2">
            <label class="field"><span data-t="month"></span>
              <select id="month"></select>
            </label>
            <label class="field"><span data-t="area"></span>
              <input id="area" type="number" min="1" max="20000" step="1" value="100" inputmode="decimal">
            </label>
          </div>
          <p class="help" id="month-help"></p>
          <div class="field"><span data-t="soil"></span>
            <div class="seg" id="soil" role="group"></div>
          </div>
          <p class="help" id="soil-help"></p>
          <label class="check"><input id="salty" type="checkbox"><span data-t="salty"></span></label>
        </div>
      </div>

      <div class="step">
        <span class="num">2</span>
        <div class="step-body">
          <h3 data-t="step2"></h3>
          <div class="water-control">
            <div class="water-head">
              <label for="allocation" data-t="allocation"></label>
              <output id="allocation-out" for="allocation"></output>
            </div>
            <input id="allocation" type="range" min="0" max="100" step="5" value="60">
            <div class="light" id="light" role="group"></div>
          </div>
          <p class="help" id="water-help"></p>
          <label class="check"><input id="rice-banned" type="checkbox"><span data-t="rice_banned"></span></label>
          <details class="more">
            <summary data-t="what_is"></summary>
            <p data-t="allocation_hint"></p>
            <p data-t="light_note"></p>
          </details>
        </div>
      </div>

      <div class="step">
        <span class="num">3</span>
        <div class="step-body">
          <h3 data-t="step3"></h3>
          <div class="seg" id="priority" role="group"></div>
          <p class="help" id="priority-help"></p>
        </div>
      </div>
    </aside>

    <div class="results">
      <p class="headline" id="headline" aria-live="polite" data-view="plan rotation options"></p>

      <section class="glass plan" aria-labelledby="parcel-title" data-view="plan">
        <div>
          <h2 id="parcel-title" data-t="parcel_title"></h2>
          <p class="sub" id="parcel-sub"></p>
          <div class="plot big" id="parcel" aria-hidden="true"></div>
        </div>
        <div class="plan-side">
          <div class="mix" id="plan-mix"></div>
          <div class="impact" id="impact"></div>
          <div class="actions" id="plan-actions"></div>
          <div class="next">
            <button type="button" class="btn" data-go="rotation" data-t="go_rotation"></button>
            <button type="button" class="btn" data-go="options" data-t="go_options"></button>
          </div>
        </div>
      </section>

      <section class="glass" aria-labelledby="rotation-title" data-view="rotation">
        <h2 id="rotation-title" data-t="rotation_title"></h2>
        <p class="sub" data-t="rotation_sub"></p>
        <div id="rotation"></div>
      </section>

      <section aria-labelledby="strategies-title" data-view="options">
        <h2 id="strategies-title" data-t="strategies"></h2>
        <p class="sub" data-t="strategies_sub"></p>
        <div class="legend" id="legend"></div>
        <div class="cards" id="cards"></div>
        <details class="more">
          <summary data-t="what_scores"></summary>
          <p data-t="score_help"></p>
        </details>
      </section>

      <section class="glass detail" id="detail" aria-live="polite" data-view="options"></section>

      <div data-view="data">
        <h2 data-t="data_title"></h2>
        <p class="sub" data-t="data_sub"></p>
      </div>

      <details class="glass fold" data-view="data" open>
        <summary><span class="fold-ico" aria-hidden="true">💧</span><span><b data-t="needs_title"></b><small data-t="needs_fx"></small></span></summary>
        <p class="sub" id="needs-sub"></p>
        <div id="needs"></div>
        <p class="note" data-t="needs_note"></p>
      </details>

      <details class="glass fold" data-view="data">
        <summary><span class="fold-ico" aria-hidden="true">🌧️</span><span><b data-t="climate_title"></b><small data-t="climate_fx"></small></span></summary>
        <p class="sub" id="climate-sub"></p>
        <div id="climate"></div>
        <p class="note" id="climate-note"></p>
      </details>

      <details class="glass fold" data-view="data">
        <summary><span class="fold-ico" aria-hidden="true">🌡️</span><span><b data-t="heat_title"></b><small data-t="heat_fx"></small></span></summary>
        <p class="sub" id="heat-sub"></p>
        <div class="heat" id="heat"></div>
        <div class="key" id="heat-key"></div>
        <p class="note" data-t="heat_note"></p>
      </details>
    </div>
  </main>

  <!-- ===================== MAP ===================== -->
  <section class="page" data-view="map">
    <div class="glass map-card" aria-labelledby="map-title">
      <h2 id="map-title" data-t="map_title"></h2>
      <p class="sub" data-t="map_sub"></p>
      <div class="seg layers" id="layers" role="group"></div>
      <div id="map"></div>
      <div class="key" id="map-key"></div>
      <p class="note" data-t="map_note"></p>
    </div>
    <div class="glass" id="basin-section" aria-labelledby="basin-title">
      <h2 id="basin-title" data-t="basin_title"></h2>
      <p class="sub" data-t="basin_fx"></p>
      <div id="basin"></div>
    </div>
  </section>

  <!-- ===================== HELP ===================== -->
  <section class="page" data-view="help">
    <div class="glass">
      <h2 data-t="faq_title"></h2>
      <p class="sub" data-t="faq_sub"></p>
      <div id="faq"></div>
    </div>
    <div class="glass trust">
      <h2 data-t="trust_title"></h2>
      <p class="sub" data-t="trust_fx"></p>
      <details open>
        <summary data-t="limits_title"></summary>
        <ul id="limits"></ul>
      </details>
      <details>
        <summary data-t="method_title"></summary>
        <ul id="method"></ul>
      </details>
      <details>
        <summary data-t="sources_title"></summary>
        <ul id="sources"></ul>
      </details>
    </div>
  </section>

  <footer class="foot">
    <p data-t="foot_support"></p>
    <p data-t="foot_ai"></p>
    <p data-t="foot_nasa"></p>
  </footer>

  <nav class="tabbar" id="tabbar" aria-label="Secciones / Sections"></nav>

  <div id="sheet" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script src="geo.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
