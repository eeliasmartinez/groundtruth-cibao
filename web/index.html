<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GroundTruth Cibao · Plan B</title>
  <meta name="description" content="Crop-rotation decision support for rice farmers of the Dominican Republic, powered by NASA POWER data.">
  <meta name="theme-color" content="#1238a8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="home">
  <header class="top">
    <a class="brand" href="#home" data-go="home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 3c5 6 8 10.5 8 15a8 8 0 0 1-16 0c0-4.5 3-9 8-15z" fill="#1463c4"/>
        <path d="M16 29V15m0 6c-3-.5-5-2.5-5.5-5.5M16 18c3-.5 5-2.5 5.5-5.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>GroundTruth Cibao</span>
    </a>
    <button type="button" class="btn small" id="back" hidden data-t="back"></button>
    <nav class="nav" id="nav" aria-label="Secciones / Sections"></nav>
    <div class="top-right">
      <button type="button" class="btn small" id="install" hidden data-t="install"></button>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" class="on">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <!-- ===================== HOME ===================== -->
  <section class="hero" data-view="home">
    <div class="hero-in">
      <div class="hero-copy">
        <div class="mode-switch" role="group" data-t-label="w_mode_label">
          <button type="button" data-mode="local" data-go="home" data-t="w_mode_local"></button>
          <button type="button" data-mode="world" data-go="world" data-t="w_mode_world"></button>
        </div>
        <h1 data-t="hero_title"></h1>
        <p class="lead" data-t="hero_lead"></p>
        <div class="hero-actions">
          <button type="button" class="btn primary big" id="start" data-t="start_btn"></button>
          <button type="button" class="btn big" id="start-easy" data-t="easy_start"></button>
        </div>
      </div>
      <div class="hero-map">
        <div id="h-map"></div>
        <p class="hero-map-note" data-t="hero_map_note"></p>
      </div>
    </div>
  </section>

  <section class="why" data-view="home">
    <h2 data-t="why_title"></h2>
    <ul class="facts" id="facts"></ul>
    <div class="crop-entry">
      <p data-t="crop_entry_copy"></p>
      <button type="button" class="btn" data-go="crops" data-t="crop_entry_button"></button>
    </div>
  </section>

  <section class="journey" data-view="home" aria-labelledby="journey-title">
    <header class="journey-head">
      <h2 id="journey-title" data-t="journey_title"></h2>
      <p data-t="journey_intro"></p>
    </header>
    <div class="journey-layout">
      <div class="journey-visual" id="journey-visual" data-beat="1">
        <div class="journey-map" id="j-map"></div>
        <div class="journey-readout" aria-live="polite">
          <b id="journey-kicker" data-t="journey_kicker_1"></b>
          <span id="journey-copy" data-t="journey_copy_1"></span>
        </div>
      </div>
      <div class="journey-chapters">
        <article class="journey-chapter" data-beat="1">
          <span>01</span><h3 data-t="journey_step_1"></h3><p data-t="journey_text_1"></p>
        </article>
        <article class="journey-chapter" data-beat="2">
          <span>02</span><h3 data-t="journey_step_2"></h3><p data-t="journey_text_2"></p>
        </article>
        <article class="journey-chapter" data-beat="3">
          <span>03</span><h3 data-t="journey_step_3"></h3><p data-t="journey_text_3"></p>
        </article>
      </div>
    </div>
  </section>

  <!-- ============ DOMINICAN CROP DIRECTORY ============ -->
  <section class="page crop-page" data-view="crops">
    <div class="crop-heading">
      <button type="button" class="btn back" data-go="home" data-t="crop_back"></button>
      <div>
        <p class="crop-kicker" data-t="crop_kicker"></p>
        <h2 data-t="crop_title"></h2>
        <p class="sub" data-t="crop_intro"></p>
      </div>
      <div class="crop-count"><b id="crop-total">39</b><span data-t="crop_count_label"></span></div>
    </div>
    <div class="crop-overview" id="crop-overview"></div>
    <section class="cw" aria-labelledby="cw-title">
      <h3 id="cw-title" data-t="cw_title"></h3>
      <p class="sub" data-t="cw_intro"></p>
      <div class="crop-controls cw-controls">
        <label><span data-t="cw_zone"></span><select id="cw-zone"></select></label>
        <label><span data-t="cw_month"></span><select id="cw-month"></select></label>
        <label><span data-t="cw_soil"></span><select id="cw-soil"></select></label>
        <label><span data-t="cw_area"></span><input id="cw-area" type="number" min="1" max="20000" inputmode="decimal"></label>
        <label><span data-t="cw_alloc"></span><span class="cw-range"><input id="cw-alloc" type="range" min="0" max="100" step="5"><output id="cw-alloc-out"></output></span></label>
      </div>
      <p class="cw-budget" id="cw-budget" aria-live="polite"></p>
      <div class="cw-mine">
        <h4 data-t="mine_title"></h4>
        <p class="help" data-t="mine_help"></p>
        <div class="cw-chips" id="cw-chips"></div>
      </div>
      <div class="cw-rec" id="cw-rec" aria-live="polite"></div>
      <div class="cw-table" id="cw-table"></div>
      <p class="note" data-t="cw_note"></p>
    </section>
    <div class="crop-controls">
      <label><span data-t="crop_search_label"></span><input id="crop-search" type="search" data-t-placeholder="crop_search_placeholder"></label>
      <label><span data-t="crop_group_label"></span><select id="crop-group"></select></label>
      <label><span data-t="crop_model_label"></span><select id="crop-model"></select></label>
    </div>
    <p class="crop-key" data-t="crop_key"></p>
    <div class="crop-browser">
      <div class="crop-list-wrap">
        <p class="crop-result-count" id="crop-result-count" aria-live="polite"></p>
        <div class="crop-list" id="crop-list"></div>
      </div>
      <aside class="crop-profile" id="crop-profile" aria-live="polite"></aside>
    </div>
    <p class="note crop-source" data-t="crop_source_note"></p>
  </section>

  <!-- ============ WORLD PROTOTYPE (world.js) ============ -->
  <section class="page world-page" data-view="world">
    <div class="mode-switch" role="group">
      <button type="button" data-mode="local" data-go="home" data-t="w_mode_local"></button>
      <button type="button" data-mode="world" data-go="world" data-t="w_mode_world"></button>
    </div>
    <div class="world-head">
      <h2 data-t="w_title"></h2>
      <p class="sub" data-t="w_intro"></p>
    </div>
    <div class="world-stage">
      <canvas id="w-globe" data-t-label="w_globe_label"></canvas>
      <p class="w-hover" id="w-hover" aria-live="polite"></p>
    </div>
    <div class="crop-controls w-controls">
      <label><span data-t="w_pick"></span><select id="w-country"></select></label>
    </div>
    <p class="note" data-t="w_note"></p>
  </section>
  <section class="page world-page" data-view="country">
    <div class="world-head">
      <h2 id="wc-title"></h2>
      <p class="sub" id="wc-sub"></p>
      <p class="w-status" id="wc-status" aria-live="polite"></p>
    </div>
    <div class="wc-layout">
      <div class="wc-map" id="wc-map"></div>
      <aside class="wc-side">
        <h3 data-t="w_crops_country"></h3>
        <ol class="wc-crops" id="wc-crops"></ol>
        <p class="note" id="wc-crops-note"></p>
      </aside>
    </div>
    <h3 data-t="w_provinces"></h3>
    <div class="wc-list" id="wc-list"></div>
    <p class="note" data-t="w_country_note"></p>
  </section>
  <section class="page world-page" data-view="region">
    <div class="world-head">
      <h2 id="wr-title"></h2>
      <p class="sub" id="wr-sub"></p>
      <p class="w-status" id="wr-status" aria-live="polite"></p>
    </div>
    <div class="wr-layout">
      <div class="wc-map" id="wr-map"></div>
      <div class="wr-climate" id="wr-climate"></div>
    </div>
    <div class="crop-controls wr-controls">
      <label><span data-t="cw_month"></span><select id="wr-month"></select></label>
      <label><span data-t="cw_soil"></span><select id="wr-soil"></select></label>
    </div>
    <div class="cw-rec" id="wr-rec" aria-live="polite"></div>
  </section>

  <!-- ===================== GUIDED WALKTHROUGH ===================== -->
  <section class="guide" id="guide" data-view="guide">
    <div class="g-top">
      <span id="g-count"></span>
      <div class="g-progress"><i id="g-bar"></i></div>
    </div>
    <div class="g-layout" id="g-layout">
      <aside class="g-scene" id="g-scene-panel" hidden>
        <div class="z-stage">
          <canvas id="g-canvas" aria-hidden="true"></canvas>
          <details class="scene-context-menu">
            <summary data-t="field_map_data"></summary>
            <div class="scene-context" id="g-scene-context" aria-live="polite"></div>
          </details>
          <p class="note" data-t="z_note"></p>
        </div>
        <p class="g-scene-label" data-t="g_scene_label"></p>
      </aside>
      <div class="panel g-card">
        <div id="g-stage" aria-live="polite"></div>
        <div class="g-foot">
          <button type="button" class="btn big" data-g-back></button>
          <button type="button" class="btn primary big" data-g-next></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ MY PLAN · ROTATION · OPTIONS · DATA (share the three steps) ============ -->
  <main class="layout" data-view="plan rotation options data">
    <details class="farm-settings" id="farm-settings" open>
      <summary class="farm-settings-bar">
        <span class="farm-settings-title" data-t="farm_conditions"></span>
        <span class="farm-settings-values" id="farm-settings-values"></span>
        <span class="farm-settings-action"><b class="farm-settings-edit" data-t="edit_conditions"></b><b class="farm-settings-hide" data-t="hide_conditions"></b><i aria-hidden="true"></i></span>
      </summary>
    <aside class="panel controls" id="steps" aria-labelledby="farm-title">
      <h2 id="farm-title" data-t="farm"></h2>

      <div class="step">
        <span class="num">1</span>
        <div class="step-body">
          <h3 data-t="step1"></h3>
          <label class="field"><span data-t="zone"></span>
            <select id="zone"></select>
          </label>
          <div class="row2">
            <label class="field"><span data-t="month"></span>
              <select id="month"></select>
            </label>
            <label class="field"><span data-t="area"></span>
              <input id="area" type="number" min="1" max="20000" step="1" value="100" inputmode="decimal">
            </label>
          </div>
          <p class="help" id="month-help"></p>
          <div class="field"><span data-t="soil"></span>
            <div class="seg" id="soil" role="group"></div>
          </div>
          <p class="help" id="soil-help"></p>
          <label class="check"><input id="salty" type="checkbox"><span data-t="salty"></span></label>
        </div>
      </div>

      <div class="step">
        <span class="num">2</span>
        <div class="step-body">
          <h3 data-t="step2"></h3>
          <div class="water-control">
            <div class="water-head">
              <label for="allocation" data-t="allocation"></label>
              <output id="allocation-out" for="allocation"></output>
            </div>
            <input id="allocation" type="range" min="0" max="100" step="5" value="60">
            <div class="light" id="light" role="group"></div>
          </div>
          <p class="help" id="water-help"></p>
          <label class="check"><input id="rice-banned" type="checkbox"><span data-t="rice_banned"></span></label>
          <details class="more">
            <summary data-t="what_is"></summary>
            <p data-t="allocation_hint"></p>
            <p data-t="light_note"></p>
          </details>
        </div>
      </div>

      <div class="step">
        <span class="num">3</span>
        <div class="step-body">
          <h3 data-t="step3"></h3>
          <div class="seg" id="priority" role="group"></div>
          <p class="help" id="priority-help"></p>
        </div>
      </div>
    </aside>

    </details>

    <div class="results">
      <button type="button" class="btn back" data-go="plan" data-view="rotation options data" data-t="back_plan"></button>
      <p class="headline" id="headline" aria-live="polite" data-view="plan"></p>

      <section class="panel plan" aria-labelledby="parcel-title" data-view="plan">
        <div>
          <h2 id="parcel-title" data-t="parcel_title"></h2>
          <p class="sub" id="parcel-sub"></p>
          <div class="plot big" id="parcel" aria-hidden="true"></div>
          <div class="parcel-context" id="parcel-context" aria-live="polite"></div>
        </div>
        <div class="plan-side">
          <div class="mix" id="plan-mix"></div>
          <div class="impact" id="impact"></div>
          <div class="actions" id="plan-actions"></div>
          <p class="local-save-note" id="local-save-note" aria-live="polite" hidden></p>
          <div class="next">
            <button type="button" class="btn" data-go="rotation" data-t="go_rotation"></button>
            <button type="button" class="btn" data-go="options" data-t="go_options"></button>
          </div>
        </div>
      </section>

      <section class="panel" aria-labelledby="rotation-title" data-view="rotation">
        <h2 id="rotation-title" data-t="rotation_title"></h2>
        <p class="sub" data-t="rotation_sub"></p>
        <div id="rotation"></div>
      </section>

      <section aria-labelledby="strategies-title" data-view="options">
        <h2 id="strategies-title" data-t="strategies"></h2>
        <p class="sub" data-t="strategies_sub"></p>
        <div class="legend" id="legend"></div>
        <div class="cards" id="cards"></div>
        <details class="more">
          <summary data-t="what_scores"></summary>
          <p data-t="score_help"></p>
        </details>
      </section>

      <section class="panel detail" id="detail" aria-live="polite" data-view="options"></section>

      <div data-view="data">
        <h2 data-t="data_title"></h2>
        <p class="sub" data-t="data_sub"></p>
      </div>

      <details class="panel fold" data-view="data" open>
        <summary><span><b data-t="needs_title"></b><small data-t="needs_fx"></small></span></summary>
        <p class="sub" id="needs-sub"></p>
        <div id="needs"></div>
        <p class="note" data-t="needs_note"></p>
      </details>

      <details class="panel fold" data-view="data">
        <summary><span><b data-t="climate_title"></b><small data-t="climate_fx"></small></span></summary>
        <p class="sub" id="climate-sub"></p>
        <div id="climate"></div>
        <p class="note" id="climate-note"></p>
      </details>

      <details class="panel fold" data-view="data">
        <summary><span><b data-t="heat_title"></b><small data-t="heat_fx"></small></span></summary>
        <p class="sub" id="heat-sub"></p>
        <div class="heat" id="heat"></div>
        <div class="key" id="heat-key"></div>
        <p class="note" data-t="heat_note"></p>
      </details>
    </div>
  </main>

  <!-- ===================== MAP ===================== -->
  <section class="page" data-view="map">
    <div class="panel map-card" aria-labelledby="map-title">
      <h2 id="map-title" data-t="map_title"></h2>
      <p class="sub" data-t="map_sub"></p>
      <div class="seg layers" id="layers" role="group"></div>
      <div id="map"></div>
      <div class="key" id="map-key"></div>
      <p class="note" data-t="map_note"></p>
    </div>
    <div class="panel" id="basin-section" aria-labelledby="basin-title">
      <h2 id="basin-title" data-t="basin_title"></h2>
      <p class="sub" data-t="basin_fx"></p>
      <div id="basin"></div>
    </div>
  </section>

  <!-- ===================== ZONE EXPLORER (3D) ===================== -->
  <section class="page zone-page" data-view="zone">
    <div class="zone-head">
      <button type="button" class="btn back" data-go="map" data-t="back_map"></button>
      <h2 id="z-title"></h2>
      <p class="sub" id="z-sub"></p>
      <p class="note pick-note" id="z-pick-note" aria-live="polite" hidden></p>
    </div>
    <div class="zone-grid">
      <div class="z-stage">
        <canvas id="z-canvas" aria-hidden="true"></canvas>
        <details class="scene-context-menu">
          <summary data-t="field_map_data"></summary>
          <div class="scene-context" id="z-scene-context" aria-live="polite"></div>
        </details>
        <p class="note" data-t="z_note"></p>
      </div>
      <div class="panel z-info">
        <div class="impact" id="z-stats"></div>
        <div id="z-lists"></div>
        <p id="z-farm-note" class="note" aria-live="polite"></p>
        <button type="button" class="btn primary big" id="z-plan" data-t="z_plan"></button>
      </div>
    </div>
  </section>

  <!-- ===================== HELP ===================== -->
  <section class="page" data-view="help">
    <div class="panel">
      <h2 data-t="soilg_title"></h2>
      <p class="sub" data-t="soilg_sub"></p>
      <div id="soil-guide"></div>
    </div>
    <div class="panel">
      <h2 data-t="faq_title"></h2>
      <p class="sub" data-t="faq_sub"></p>
      <div id="faq"></div>
    </div>
    <div class="panel trust">
      <h2 data-t="trust_title"></h2>
      <p class="sub" data-t="trust_fx"></p>
      <details open>
        <summary data-t="limits_title"></summary>
        <ul id="limits"></ul>
      </details>
      <details>
        <summary data-t="method_title"></summary>
        <ul id="method"></ul>
      </details>
      <details>
        <summary data-t="sources_title"></summary>
        <ul id="sources"></ul>
      </details>
    </div>
  </section>

  <footer class="foot">
    <p data-t="foot_support"></p>
    <p data-t="foot_ai"></p>
    <p data-t="foot_nasa"></p>
  </footer>

  <nav class="tabbar" id="tabbar" aria-label="Secciones / Sections"></nav>

  <div id="sheet" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script src="geo.js"></script>
  <script src="provinces.js"></script>
  <script src="relief.js"></script>
  <script src="peaks.js"></script>
  <script src="crops_local.js"></script>
  <script src="world_data.js"></script>
  <script src="copy.js"></script>
  <script src="storage.js"></script>
  <script src="engine.js"></script>
  <script src="world.js"></script>
  <script src="app.js"></script>
</body>
</html>
